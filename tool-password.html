<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密碼產生器 · 青魚工具箱</title>
<style>
  :root{ --deep:#0A1F2B; --teal:#2E8B95; --seafoam:#7FD8C4; --coral:#FF8A5B; --foam:#EAF4F4; --dim:#A9C6C6; --line:rgba(127,216,196,0.18); }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% -10%,#1B5468,transparent 55%),var(--deep);color:var(--foam);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;display:flex;justify-content:center}
  .wrap{max-width:420px;width:100%;padding:28px 20px 60px}
  h1{font-size:1.3rem;margin:0 0 4px}
  .sub{font-size:0.82rem;color:var(--dim);margin-bottom:22px}
  .panel{border-radius:22px;background:linear-gradient(160deg,rgba(22,75,96,0.5),rgba(10,31,43,0.4));border:1px solid var(--line);padding:22px;box-shadow:0 18px 40px rgba(4,14,20,0.45)}
  .output{display:flex;align-items:center;gap:10px;background:rgba(10,31,43,0.55);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
  .output input{flex:1;background:transparent;border:none;color:var(--seafoam);font-size:1.15rem;font-family:monospace;letter-spacing:0.03em;outline:none}
  .output button{border:none;background:rgba(127,216,196,0.14);color:var(--foam);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px}
  .row .label{font-size:0.9rem}
  .row input[type=range]{width:140px}
  .switch{position:relative;width:44px;height:24px}
  .switch input{opacity:0;width:0;height:0}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,0.12);border:1px solid var(--line)}
  .switch .track::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--foam);top:2px;left:2px;transition:transform .18s}
  .switch input:checked + .track{background:linear-gradient(160deg,var(--seafoam),var(--teal))}
  .switch input:checked + .track::after{transform:translateX(20px);background:#06222B}
  .btn{display:block;width:100%;border:none;padding:13px;border-radius:999px;background:linear-gradient(160deg,var(--seafoam),var(--teal));color:#06222B;font-weight:700;font-size:0.95rem;cursor:pointer;margin-top:16px}
  .back{display:block;text-align:center;margin-top:20px;font-size:0.8rem;color:var(--dim);text-decoration:none}
  .strength{font-size:0.76rem;color:var(--dim);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 密碼產生器</h1>
  <div class="sub">青魚工具箱 · 自訂長度與字元組合</div>

  <div class="panel">
    <div class="output">
      <input type="text" id="pwOutput" readonly>
      <button id="copyBtn" title="複製">📋</button>
    </div>

    <div class="row">
      <div class="label">長度：<span id="lenVal">16</span></div>
      <input type="range" id="len" min="6" max="48" value="16">
    </div>
    <div class="row">
      <div class="label">大寫字母 A-Z</div>
      <label class="switch"><input type="checkbox" id="upper" checked><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="label">小寫字母 a-z</div>
      <label class="switch"><input type="checkbox" id="lower" checked><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="label">數字 0-9</div>
      <label class="switch"><input type="checkbox" id="digits" checked><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="label">符號 !@#$…</div>
      <label class="switch"><input type="checkbox" id="symbols"><span class="track"></span></label>
    </div>

    <button class="btn" id="genBtn">產生新密碼</button>
    <div class="strength" id="strength"></div>
  </div>

  <a class="back" href="./index.html">← 回到青魚工具箱</a>
</div>

<script>
(() => {
  const pwOutput = document.getElementById('pwOutput');
  const copyBtn = document.getElementById('copyBtn');
  const len = document.getElementById('len');
  const lenVal = document.getElementById('lenVal');
  const upper = document.getElementById('upper');
  const lower = document.getElementById('lower');
  const digits = document.getElementById('digits');
  const symbols = document.getElementById('symbols');
  const genBtn = document.getElementById('genBtn');
  const strength = document.getElementById('strength');

  const SETS = {
    upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
    lower: 'abcdefghijkmnpqrstuvwxyz',
    digits: '23456789',
    symbols: '!@#$%^&*()-_=+[]{}',
  };

  function randInt(max){
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function generate(){
    let pool = '';
    if(upper.checked) pool += SETS.upper;
    if(lower.checked) pool += SETS.lower;
    if(digits.checked) pool += SETS.digits;
    if(symbols.checked) pool += SETS.symbols;
    if(!pool){ pwOutput.value = ''; strength.textContent = '至少勾選一種字元類型'; return; }
    const n = Number(len.value);
    let out = '';
    for(let i=0;i<n;i++) out += pool[randInt(pool.length)];
    pwOutput.value = out;

    const typeCount = [upper.checked, lower.checked, digits.checked, symbols.checked].filter(Boolean).length;
    const score = n * typeCount;
    strength.textContent = score > 60 ? '強度：非常強 💪' : score > 30 ? '強度：中等 👍' : '強度：偏弱，建議加長或增加字元類型';
  }

  len.addEventListener('input', () => { lenVal.textContent = len.value; generate(); });
  [upper, lower, digits, symbols].forEach(el => el.addEventListener('change', generate));
  genBtn.addEventListener('click', generate);
  copyBtn.addEventListener('click', async () => {
    if(!pwOutput.value) return;
    try{
      await navigator.clipboard.writeText(pwOutput.value);
      copyBtn.textContent = '✅';
      setTimeout(() => copyBtn.textContent = '📋', 1200);
    }catch(e){
      pwOutput.select();
      document.execCommand('copy');
    }
  });

  generate();
})();
</script>
</body>
</html>
