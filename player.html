<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>背景播放器 · 青魚工具箱</title>
<meta name="theme-color" content="#0A1F2B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="tide"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="./index.html" aria-label="返回首頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <h1>背景播放器</h1>
      <div class="sub">匯入影片或音檔，背景播放或卡拉OK模式</div>
    </div>
  </div>

  <!-- 匯入檔案 -->
  <div class="panel">
    <h2>匯入檔案</h2>
    <label class="upload-zone" id="uploadZone">
      <div class="icon">🐟</div>
      <div class="label">點一下加入影片或音檔<small>支援 mp4、mp3、m4a、wav 等常見格式，可一次選多個</small></div>
      <input type="file" id="fileInput" accept="video/*,audio/*" multiple hidden>
    </label>
  </div>

  <!-- 播放模式 -->
  <div class="panel">
    <h2>播放模式</h2>
    <div class="segment" id="modeSegment">
      <button data-mode="bg" class="active" type="button">
        <span>🎧</span> 背景播放
      </button>
      <button data-mode="karaoke" type="button">
        <span>🎤</span> 卡拉OK模式
      </button>
    </div>

    <div class="switch-row">
      <div class="label">循環播放<small>播完整份清單後自動重頭再播</small></div>
      <label class="switch">
        <input type="checkbox" id="loopToggle">
        <span class="track"></span>
      </label>
    </div>

    <div id="bgModeHint" class="hint">背景播放模式下，離開分頁、鎖定螢幕或切到其他 App，聲音仍會繼續播放，並可從鎖定畫面控制播放／暫停／上下首。</div>
    <div id="karaokeModeHint" class="hint" style="display:none">卡拉OK模式會保持畫面開啟並防止螢幕自動熄滅，適合搭配 MV／字幕影片跟著唱。切到背景會暫停播放。</div>
  </div>

  <!-- 播放器主體：karaoke 顯示影片，背景模式顯示唱片動畫；同一顆 <video> 元素 -->
  <div class="player-stage">
    <div class="stage-karaoke" id="stageKaraoke" style="display:none">
      <video id="mediaEl" playsinline></video>
    </div>
    <div class="stage-bg" id="stageBg">
      <div class="disc" id="disc"><div class="hub">🐠</div></div>
      <div class="now-title" id="nowTitle">尚未選擇曲目</div>
      <div class="now-sub" id="nowSub">從下方清單點選開始播放</div>
    </div>

    <div class="stage-bg" style="padding-top:0">
      <div class="progress-row">
        <span class="time" id="curTime">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
        <span class="time right" id="durTime">0:00</span>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="prevBtn" aria-label="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L10 12l10 6z"/></svg>
        </button>
        <button class="ctrl-btn play" id="playBtn" aria-label="播放／暫停">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg>
        </button>
      </div>
      <div id="wakeNote" class="wake-note" style="display:none">
        <span>🔒</span> 已鎖定螢幕不熄滅（卡拉OK模式）
      </div>
    </div>
  </div>

  <!-- 播放清單 -->
  <div class="panel">
    <h2>播放清單</h2>
    <div class="playlist" id="playlist"></div>
    <div class="empty-note" id="emptyNote">目前沒有任何檔案，先從上方加入影片或音檔吧</div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="inner">
    <a href="./index.html"><span class="ic">🏠</span>首頁</a>
    <a href="./player.html" class="active"><span class="ic">🎧</span>播放器</a>
    <a href="./timer.html"><span class="ic">⏱️</span>計時器</a>
    <a href="./notes.html"><span class="ic">📝</span>隨手記</a>
    <a href="./store.html"><span class="ic">🛍️</span>商店</a>
  </div>
</nav>

<script src="./js/db.js"></script>
<script src="./js/app.js"></script>
<script src="./js/player.js"></script>
</body>
</html>
