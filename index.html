<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>青魚工具箱</title>
<meta name="theme-color" content="#0A1F2B">
<meta name="description" content="青魚工具箱：影片音檔背景播放、卡拉OK模式，還有工具商店、計時器與隨手記等小工具。">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="tide"></div>
<div class="shell">

  <div class="topbar" style="padding-top:14px">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 100 60" fill="none">
          <path d="M20 30c0-11 9-20 20-20 12 0 21 6 27 14 3-5 9-9 15-9-2 6-2 12 0 18-6 0-12-4-15-9-6 8-15 14-27 14-11 0-20-9-20-20z" fill="#7FD8C4"/>
          <path d="M20 30L4 20v20l16-10z" fill="#7FD8C4"/>
          <circle cx="52" cy="24" r="3" fill="#0A1F2B"/>
        </svg>
      </div>
      <div>
        <h1 style="font-size:1.4rem">青魚工具箱</h1>
        <div class="sub">影音背景播放、工具商店，還有幾個順手的小工具</div>
      </div>
    </div>
  </div>

  <div class="tool-grid">
    <a class="tool-card" href="./player.html">
      <div class="icon">🎧</div>
      <div>
        <div class="title">背景播放器</div>
        <div class="desc">匯入影片或音檔，鎖螢幕也能繼續播；或切成卡拉OK模式跟著唱</div>
      </div>
      <div class="flag">主功能</div>
    </a>

    <a class="tool-card small" href="./timer.html">
      <div class="icon">⏱️</div>
      <div class="title">計時器</div>
      <div class="desc">倒數計時，時間到會提醒你</div>
    </a>

    <a class="tool-card small" href="./notes.html">
      <div class="icon">📝</div>
      <div class="title">隨手記</div>
      <div class="desc">快速記下一段文字，存在裝置上</div>
    </a>

    <a class="tool-card" href="./store.html">
      <div class="icon">🛍️</div>
      <div>
        <div class="title">工具商店</div>
        <div class="desc">輸入代碼解鎖，下載更多獨立小工具（番茄鐘、白噪音、密碼產生器…）</div>
      </div>
      <div class="flag">新上架</div>
    </a>
  </div>

  <div class="panel" style="margin-top:22px">
    <h2>把青魚加到主畫面</h2>
    <div class="hint">用瀏覽器的「加入主畫面／安裝應用程式」，之後就能像 App 一樣從主畫面直接開啟，離線也能用。</div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="inner">
    <a href="./index.html" class="active"><span class="ic">🏠</span>首頁</a>
    <a href="./player.html"><span class="ic">🎧</span>播放器</a>
    <a href="./timer.html"><span class="ic">⏱️</span>計時器</a>
    <a href="./notes.html"><span class="ic">📝</span>隨手記</a>
    <a href="./store.html"><span class="ic">🛍️</span>商店</a>
  </div>
</nav>

<script src="./js/app.js"></script>
</body>
</html>
