<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>計時器 · 青魚工具箱</title>
<meta name="theme-color" content="#0A1F2B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="tide"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="./index.html" aria-label="返回首頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <h1>計時器</h1>
      <div class="sub">倒數計時，時間到會提醒你</div>
    </div>
  </div>

  <div class="panel">
    <div class="timer-display" id="display">05:00</div>
    <div class="preset-row" id="presets">
      <button data-min="1">1 分</button>
      <button data-min="3">3 分</button>
      <button data-min="5" class="active">5 分</button>
      <button data-min="10">10 分</button>
      <button data-min="20">20 分</button>
    </div>
    <div class="preset-row" style="margin-top:10px">
      <input type="text" id="customMin" placeholder="自訂分鐘數" inputmode="numeric" style="width:140px;text-align:center">
      <button class="btn ghost" id="setCustom" type="button">套用</button>
    </div>

    <div class="controls-row" style="margin-top:18px">
      <button class="ctrl-btn" id="resetBtn" aria-label="重設">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 4v6h6"/></svg>
      </button>
      <button class="ctrl-btn play" id="startBtn" aria-label="開始／暫停">
        <svg id="startIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="beepToggleBtn" aria-label="提示音">
        <span id="beepIcon">🔔</span>
      </button>
    </div>
    <div class="hint" style="text-align:center;margin-top:14px" id="statusHint">設定好時間後按下開始</div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="inner">
    <a href="./index.html"><span class="ic">🏠</span>首頁</a>
    <a href="./player.html"><span class="ic">🎧</span>播放器</a>
    <a href="./timer.html" class="active"><span class="ic">⏱️</span>計時器</a>
    <a href="./notes.html"><span class="ic">📝</span>隨手記</a>
    <a href="./store.html"><span class="ic">🛍️</span>商店</a>
  </div>
</nav>

<script src="./js/app.js"></script>
<script src="./js/timer.js"></script>
</body>
</html>
