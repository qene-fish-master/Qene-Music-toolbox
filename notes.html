<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨手記 · 青魚工具箱</title>
<meta name="theme-color" content="#0A1F2B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="tide"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="./index.html" aria-label="返回首頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <h1>隨手記</h1>
      <div class="sub">快速記下一段文字，存在這台裝置上</div>
    </div>
  </div>

  <div class="panel">
    <textarea id="noteInput" rows="4" placeholder="想到什麼就先寫下來…"></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
      <button class="btn" id="saveBtn" type="button">儲存</button>
    </div>
  </div>

  <div class="panel">
    <h2>已儲存</h2>
    <div class="pill-list" id="noteList"></div>
    <div class="empty-note" id="emptyNote">還沒有任何筆記</div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="inner">
    <a href="./index.html"><span class="ic">🏠</span>首頁</a>
    <a href="./player.html"><span class="ic">🎧</span>播放器</a>
    <a href="./timer.html"><span class="ic">⏱️</span>計時器</a>
    <a href="./notes.html" class="active"><span class="ic">📝</span>隨手記</a>
    <a href="./store.html"><span class="ic">🛍️</span>商店</a>
  </div>
</nav>

<script src="./js/app.js"></script>
<script src="./js/notes.js"></script>
</body>
</html>
